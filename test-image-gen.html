<!DOCTYPE html>
<html>
<head>
    <title>Test Image Generation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #764ba2;
        }
        #result {
            margin-top: 20px;
        }
        img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .loading {
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🎨 Luna Image Generation Test</h1>
    <input type="text" id="prompt" placeholder="Enter your image prompt..." value="a cute cat playing with yarn">
    <button onclick="generateImage()">Generate Image</button>
    <div id="result"></div>

    <script>
        async function generateImage() {
            const prompt = document.getElementById('prompt').value;
            const resultDiv = document.getElementById('result');
            
            if (!prompt.trim()) {
                alert('Please enter a prompt');
                return;
            }

            resultDiv.innerHTML = '<p class="loading">Generating image... Please wait...</p>';

            try {
                const response = await fetch('http://localhost:8000/generate-image', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                if (!response.ok) {
                    throw new Error('Failed to generate image');
                }

                const data = await response.json();
                resultDiv.innerHTML = `
                    <h3>Generated Image:</h3>
                    <img src="${data.image}" alt="Generated image">
                    <p><strong>Prompt:</strong> ${prompt}</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
